<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  A THROWAWAY preview-test page. Not linked from anywhere, not indexed, and it
  bounces any human straight to the home page. It exists so the owner can see
  the real WhatsApp preview unit - image plus title plus description plus
  domain - before the home page's own tags change for everybody.

  The og tags below are EXACTLY what index.html will carry if the card ships,
  so the preview here is the preview there.

  The redirect is JavaScript on purpose: crawlers do not run JS, so WhatsApp
  reads these tags while a person never sees this page. A meta-refresh would
  risk the crawler following it to the home page and reporting the OLD card.

  Numbered because WhatsApp caches per URL on the sender's device. A second
  test needs preview-test-2.html, not a re-fetch of this one.

  DELETE THIS FILE once the card is decided.
-->

<title>העובד הראשון שלך | גיא מלול</title>
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">
<meta property="og:url" content="https://guymalul.co.il/preview-test-1.html">
<meta property="og:title" content="העובד הראשון שלך | גיא מלול">
<meta property="og:description" content="סדנה של שלוש שעות בזום. העובד הראשון שלך. לומדים איך לגייס אותו.">
<meta property="og:image" content="https://guymalul.co.il/og-card-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="מספיק להאכיל את הצ'אט בכפית. בסדנה אחת אתה לומד לגייס עובד AI שמכיר את העסק שלך.">
<meta property="og:locale" content="he_IL">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="העובד הראשון שלך | גיא מלול">
<meta name="twitter:description" content="סדנה של שלוש שעות בזום. העובד הראשון שלך. לומדים איך לגייס אותו.">
<meta name="twitter:image" content="https://guymalul.co.il/og-card-v2.png">
</head>
